name: Browser automation tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q tests
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -v -ra --junitxml=test-results/results.xml
      - name: Build dashboard from actual test results
        if: always()
        run: |
          if [ -f test-results/summary.json ]; then
            python -m automation.build_dashboard
          else
            echo "No pytest summary produced; dashboard will not be generated"
          fi
      - name: Upload dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dashboard-preview
          path: test-results/dashboard/
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
