name: Browser automation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q automation tests
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check --select E4,E9,F automation tests
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -v -ra --junitxml=test-results/results.xml
      - name: Verify JSON and JUnit test counts agree
        run: python -m automation.verify_results
      - name: Build dashboard only after verified successful tests
        run: |
          python -m automation.build_dashboard
      - name: Upload dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dashboard-preview
          path: test-results/dashboard/
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  publish:
    name: Publish verified dashboard to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified dashboard bundle
        uses: actions/download-artifact@v4
        with:
          name: browser-dashboard-preview
          path: public
      - name: Verify dashboard files
        run: |
          test -s public/index.html
          test -s public/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("public/summary.json").read_text())
          assert data["schema_version"] == 2
          assert data["pytest_exit_code"] == 0
          assert data["skipped"] == 0
          assert data["total"] > 0
          assert data["passed"] == data["total"]
          assert data["failed"] == 0
          print("Verified test report:", data["total"], "passed")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
